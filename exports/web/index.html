<div id="status">
	<div class="title">SABONG LEGENDS</div>
	<div class="subtitle">CLUCK COCK</div>
	<div class="bar busy" id="bar"><div id="bar-fill"></div></div>
	<div class="label" id="label">LOADING...</div>
	<div class="tip" id="tip"></div>
	<div class="notice" id="notice"></div>

<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":78283820,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const overlay = document.getElementById('status');
	const bar = document.getElementById('bar');
	const fill = document.getElementById('bar-fill');
	const label = document.getElementById('label');
	const tip = document.getElementById('tip');
	const notice = document.getElementById('notice');
	const TIPS = ["A higher dice roll strikes first and unlocks stronger cards.","You discard as many cards as your roll, then refill your hand.","Each round gives you 3 Taya. Most cards cost 1.","Shields only last for the round you play them.","Decluck's All For One cards grow with every extra Taya.","Daniel comes back once at a third of his HP.","Chick Yagami's poop stacks hurt more the longer they stay.","Equal dice rolls mean a clash: both attacks land at once."];

	let tipIndex = Math.floor(Math.random() * TIPS.length);
	function showTip() {
		tip.style.opacity = 0;
		setTimeout(() => {
			tip.innerHTML = '<b>TIP</b> &nbsp;' + TIPS[tipIndex];
			tip.style.opacity = 1;
			tipIndex = (tipIndex + 1) % TIPS.length;
		}, 400);
	}
	showTip();
	const tipTimer = setInterval(showTip, 5000);

	function mb(bytes) { return (bytes / 1048576).toFixed(0); }

	function showError(err) {
		console.error(err);
		clearInterval(tipTimer);
		bar.style.display = 'none';
		tip.style.display = 'none';
		label.textContent = 'COULDN\'T START THE GAME';
		const text = err instanceof Error ? err.message : (typeof err === 'string' ? err : 'An unknown error occurred.');
		notice.textContent = text + '\n\nTry reloading the page. If it keeps happening, use an up-to-date Chrome, Edge or Firefox.';
		notice.style.whiteSpace = 'pre-line';
		notice.style.display = 'block';
	}

	overlay.style.visibility = 'visible';
	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		showError('This browser is missing features the game needs:\n' + missing.join('\n'));
		return;
	}

	engine.startGame({
		onProgress: function (current, total) {
			if (current > 0 && total > 0) {
				bar.classList.remove('busy');
				const pct = Math.min(100, Math.floor(current / total * 100));
				fill.style.width = pct + '%';
				label.textContent = pct >= 100 ? 'STARTING...' : 'LOADING ' + mb(current) + ' / ' + mb(total) + ' MB';
			}
		},
	}).then(() => {
		clearInterval(tipTimer);
		overlay.remove();
	}, showError);
}());
</script>
