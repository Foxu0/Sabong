name: Render Keep-Alive Ping

on:
  schedule:
    # Ping every 10 minutes to stay well under Render's 15m idle spin-down window
    - cron: '*/10 * * * *'
  push:
    branches:
      - master
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping-render:
    name: Health Check Ping
    runs-on: ubuntu-latest
    steps:
      - name: Ping Sabong Roosters Render Server
        run: |
          echo "Sending keep-alive ping to Render..."
          curl -s --max-time 45 https://sabong-inxt.onrender.com/ping || true
          RESPONSE=$(curl -s --max-time 45 -w "\nHTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}s\n" https://sabong-inxt.onrender.com/health)
          echo "$RESPONSE"
          if echo "$RESPONSE" | grep -q "HTTP_STATUS:200"; then
            echo "Render service is awake and healthy!"
          else
            echo "Notice: Service may be waking up or returned non-200. Check logs."
          fi
